name: Xray and disaster recovery
on:
  push:
    branches: [main, 'codex/xray-*']
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: zvpn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only-password@127.0.0.1:5432/zvpn_test
      - run: npm test
        working-directory: deploy/netlify
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - run: python3 -m unittest discover -s ops/tests -v
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only-password@127.0.0.1:5432/zvpn_test
      - run: bash ops/tests/check-shell.sh
      - run: npm ci --ignore-scripts && npm run build && npx tsc --noEmit
        working-directory: frontend
      - run: bash ops/tests/test-xray-core.sh
        env:
          GH_TOKEN: ${{ github.token }}
